<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DesignCraft Layout Tool</title><link rel="stylesheet" href="run.css"></head>
<body><main>
  <h1>DesignCraft Layout Tool</h1><p class="hint">Connects to a DesignCraft window started with <code>designcraft --control 7979</code>. These are native layout commands, not shell shortcuts.</p>
  <label>CLI executable<input id="executable" placeholder="designcraft-cli"></label><label>Control port<input id="port" value="7979" placeholder="7979"></label>
  <label>Operation<select id="operation"><option value="new_a4">New A4 document</option><option value="open">Open document</option><option value="text_frame">Create text frame</option><option value="graphic_frame">Create graphic frame</option><option value="layer">Create layer</option><option value="duplicate">Duplicate selection</option><option value="group">Group selection</option><option value="ungroup">Ungroup selection</option><option value="align_left">Align selection left to margins</option><option value="align_center">Center selection on page</option><option value="align_top">Align selection top to margins</option><option value="save">Save active document</option><option value="export_pdf">Export tagged PDF/X-4</option></select></label>
  <label>Document path <span class="optional">open only</span><input id="documentPath" placeholder="/home/me/Layouts/issue.designcraft"></label><label>PDF output path <span class="optional">export only</span><input id="outputPath" placeholder="/home/me/Exports/issue.pdf"></label>
  <label>Frame text <span class="optional">text frame only</span><textarea id="text" rows="3" spellcheck="true" placeholder="Headline"></textarea></label><label>Frame rectangle <span class="optional">text/graphic frame</span><input id="rectangle" value="[72,72,400,200]"></label>
  <div class="grid"><label>Pages <span class="optional">new document</span><input id="pages" type="number" min="1" max="9999" value="1"></label><label>Layer name <span class="optional">new layer</span><input id="layerName" value="Artwork"></label></div>
  <div class="grid"><label>Key title<input id="title" placeholder="New text frame"></label><label>Timeout (seconds)<input id="timeoutSeconds" type="number" min="1" max="300" value="30"></label></div><label class="check"><input id="showOutput" type="checkbox"><span>Show result on key</span></label><p id="status" role="status">Choose a native layout command, then press the key.</p>
</main><script src="shared.js"></script><script>DesignDeck.bind(["executable","port","operation","documentPath","outputPath","text","rectangle","pages","layerName","title","timeoutSeconds","showOutput"], {port:"7979",operation:"new_a4",rectangle:"[72,72,400,200]",pages:1,layerName:"Artwork",timeoutSeconds:30});</script></body></html>
